name: base

# The build container's base image (base/Dockerfile: Debian, Chromium,
# poppler, CA certificates), ghcr.io/sadbox/know-your-systems-base. On a PR
# that changes it: built and smoke-tested on both platforms. On main: the
# same, then published as :latest, sha-<7> and its content tag (base/tag:
# chromium-<version>-<hash of base/Dockerfile>), with provenance and an
# SBOM. ./kys finds the base by that content tag, so a Chromium bump is one
# edit to base/Dockerfile; until this publishes it, ./kys builds it. This
# is the only workflow that reaches snapshot.debian.org.
on:
  pull_request:
    paths:
      - base/**
      - .github/workflows/base.yaml
  push:
    branches:
      - main
    paths:
      - base/**
      - .github/workflows/base.yaml
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time, never cancelled; a newer run replaces one still
# waiting. PR runs: one per ref.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('base-{0}', github.ref) || 'base-publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Each platform on its own runner (no QEMU). On main, pushed by digest.
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to ghcr.io/sadbox/know-your-systems-base (main only)
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4.4.1
        with:
          cache-binary: false

      - name: Build for ${{ matrix.platform }}
        uses: docker/build-push-action@v7.4.0
        with:
          context: base
          platforms: ${{ matrix.platform }}
          load: true
          tags: know-your-systems-base:test

      - name: The tools are there
        run: |
          docker run --rm know-your-systems-base:test sh -c 'chromium --version && pdftoppm -v 2>&1 | head -1 && test -s /etc/ssl/certs/ca-certificates.crt'

      - name: Login to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push by digest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: push
        uses: docker/build-push-action@v7.4.0
        with:
          context: base
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/sadbox/know-your-systems-base,push-by-digest=true,name-canonical=true,push=true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Save the digest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: mkdir -p "$RUNNER_TEMP/digest" && echo "$DIGEST" > "$RUNNER_TEMP/digest/digest.txt"

      - name: Upload the digest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: base-digest-${{ matrix.runner }}
          path: ${{ runner.temp }}/digest/digest.txt
          retention-days: 1

  # Main only: :latest and sha-<7> pointed at both platforms.
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4.4.1
        with:
          cache-binary: false

      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: base-digest-*
          path: ${{ runner.temp }}/digests

      # A re-run of an old publish must not move :latest back.
      - name: Is this commit as new as :latest's?
        id: newer
        uses: sadbox/ci/newer-than-latest@v0.7.0
        with:
          image: ghcr.io/sadbox/know-your-systems-base

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The content tag is never moved: an existing one already names a
      # build of this exact base/Dockerfile.
      - name: Point :latest, sha-<7> and the content tag at both platforms
        env:
          NEWER: ${{ steps.newer.outputs.newer }}
        run: |
          ref=ghcr.io/sadbox/know-your-systems-base
          content=$(base/tag)
          amd64=$(cat "$RUNNER_TEMP/digests/base-digest-ubuntu-26.04/digest.txt")
          arm64=$(cat "$RUNNER_TEMP/digests/base-digest-ubuntu-26.04-arm/digest.txt")
          tags=(-t "${ref}:sha-${GITHUB_SHA::7}")
          if [ "$NEWER" = true ]; then tags+=(-t "${ref}:latest"); fi
          if docker buildx imagetools inspect "${ref}:${content}" >/dev/null 2>&1; then
            echo "${ref}:${content} already exists; left as it is"
          else
            tags+=(-t "${ref}:${content}")
          fi
          docker buildx imagetools create "${tags[@]}" "${ref}@${amd64}" "${ref}@${arm64}"
          docker buildx imagetools inspect "${ref}:sha-${GITHUB_SHA::7}" | head -3 >> "$GITHUB_STEP_SUMMARY"
