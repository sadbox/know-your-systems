# Publishes the website to GitHub Pages (https://knowyoursystems.org/) from
# main: builds the PDFs and the site in the pinned container (./build), then deploys
# with GitHub's own Pages token. No secrets. Pages itself (source: Actions,
# the custom domain, HTTPS) is set in homelab-configs tofu/github.
name: pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

# One deploy at a time; never cancel one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # The base image is private: read it from GHCR with the job's token.
      # (If the pull fails anyway, ./kys builds the base itself.)
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Pulling the base is the only way, except for a change to
      # base/Dockerfile, which may not be published yet when this deploy
      # runs (base.yaml publishes it in parallel): that one change builds it (./kys, KYS_BUILD_BASE).
      - name: Does this change base/Dockerfile?
        id: base
        run: |
          if git diff --quiet HEAD^1 HEAD -- base/; then echo "build=" >> "$GITHUB_OUTPUT"; else echo "build=1" >> "$GITHUB_OUTPUT"; fi
      - name: Build the PDFs and the website
        env:
          KYS_BUILD_BASE: ${{ steps.base.outputs.build }}
        run: ./build
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5.0.1
