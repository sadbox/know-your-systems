name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # gofmt, go vet, go test -race, golangci-lint and govulncheck inside the
  # Dockerfile's `test` target (its Go), on amd64 and arm64.
  go:
    uses: sadbox/ci/.github/workflows/go.yml@689eff768c2e7660a56a7d5fd0b3036f98fed161 # v0.7.0
    permissions:
      contents: read

  lint:
    uses: sadbox/ci/.github/workflows/lint.yml@689eff768c2e7660a56a7d5fd0b3036f98fed161 # v0.7.0
    permissions:
      contents: read

  # Builds every PDF and the website in the pinned container (./build, the
  # Dockerfile), as pages.yaml does on main and as anyone does locally. The
  # build fails if any page's content does not fit, so this is the check
  # that a change to the text still prints.
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build the PDFs and the website
        run: ./build

  # What this change does to the printed pages: builds the base branch and
  # this PR, each in its own container, compares every PDF page by page, and
  # lists the changed pages in the job summary (pictures in the run's
  # page-diff artifact). For a person to look at; it never fails a PR for a
  # change, only if it can't compare.
  visual-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build this PR
        run: ./build
      - name: Build the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add .base "$BASE_SHA"
          if [ -x .base/build ]; then (cd .base && ./build); else echo "::notice::the base branch has no ./build; nothing to compare"; fi
      - name: Compare the printed pages
        run: |
          if [ -d .base/out ]; then ./kys -diff .base/out -diff-out diff >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: page-diff
          path: diff/
          if-no-files-found: ignore
          retention-days: 30
